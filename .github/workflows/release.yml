name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf curl xvfb libgtk-3-0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:server

      # 侧车 Node 运行时：scripts/build-sidecar.sh 下载 node 24 LTS 并放到
      # src-tauri/binaries/node-x86_64-unknown-linux-gnu（Tauri externalBin 约定命名）
      - name: Prepare Node sidecar
        run: bash scripts/build-sidecar.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 只构建产物，不在这里创建 Release（Release 由下面的 release job 统一发布）
      - name: Build Tauri bundles
        run: pnpm tauri build --target x86_64-unknown-linux-gnu

      - name: Smoke test built AppImage
        run: |
          set -e
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then echo "没有找到 AppImage 产物"; exit 1; fi
          echo "AppImage: $APPIMAGE"
          chmod +x "$APPIMAGE"
          PORT=8920 DATABASE_PATH=/tmp/smoke.db HOST=127.0.0.1 ENABLE_SCHEDULER=false \
            xvfb-run -a "$APPIMAGE" > /tmp/smoke.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:8920/health > /tmp/health.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "SMOKE FAILED: /health 始终无响应"
            echo "--- app log ---"; cat /tmp/smoke.log
            kill -9 "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          echo "health: $(cat /tmp/health.json)"
          curl -sf -m 5 http://127.0.0.1:8920/ > /dev/null || { echo "SMOKE FAILED: 首页未返回"; exit 1; }
          # 检查 GLIBC / CXXABI 符号问题（打包宿主与目标系统不匹配的典型症状）
          if grep -qE "GLIBC_[0-9]+\.[0-9]+.*not found|CXXABI_.*not found" /tmp/smoke.log; then
            echo "SMOKE FAILED: 动态库符号缺失"
            grep -E "GLIBC_|CXXABI_" /tmp/smoke.log | head -20
            exit 1
          fi
          kill -TERM "$APP_PID" 2>/dev/null || true
          sleep 2
          # 侧车必须随主进程退出，否则说明生命周期管理有 bug
          if pgrep -f "server.mjs" > /dev/null; then
            echo "SMOKE FAILED: 侧车进程残留"
            pkill -9 -f "server.mjs" || true
            exit 1
          fi
          echo "SMOKE OK"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          find assets -type f | sed 's/^/asset: /'
          gh release create "$TAG" $(find assets -type f) \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "桌面版发布（Tauri 壳 + Node 侧车，无需 Docker）。详见 CHANGELOG.md。" \
            --verify-tag
